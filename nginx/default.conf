# nginx inside the TaskPluse web image. Serves the built Angular files and
# nothing else: /api is routed to the API by the Kubernetes Ingress before a
# request ever reaches this server.
server {
    # nginx-unprivileged runs as a normal user, which can't bind ports below 1024.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Kubernetes probes. Answered by nginx itself - it proves the server is up
    # without depending on any file in the build.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # An /api request arriving here means the Ingress is misrouting. Without this
    # it would fall through to index.html and Angular would receive an HTML page
    # where it expected JSON - a confusing error far from its cause.
    location /api/ {
        return 404;
    }

    # The build puts a content hash in every JS and CSS file name
    # (outputHashing: all), so a new build means new names - these can be cached
    # for a year.
    location ~* \.(?:js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Anything else is a page inside the app (/login, /board, ...). Serve
    # index.html and let Angular's router take over. Never cached: an old
    # index.html would keep pointing at the previous build's file names.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
