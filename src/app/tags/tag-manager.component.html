<p-toast position="top-right"></p-toast>

<p-confirmdialog
  [style]="{ width: '30rem' }"
  acceptButtonStyleClass="p-button-danger"
  rejectButtonStyleClass="p-button-text p-button-secondary"
></p-confirmdialog>

<amb-page width="narrow">
  <amb-page-header title="Tags" [subtitle]="summary()">
    <p-button label="New tag" icon="pi pi-plus-circle" (onClick)="openCreate()"></p-button>
  </amb-page-header>

  <amb-table>
    @if (loading()) {
      <p-table [value]="skeletonRows" styleClass="tags-table" responsiveLayout="stack" breakpoint="640px">
        <ng-template pTemplate="header">
          <tr>
            <th scope="col">Tag</th>
            <th scope="col" class="tags-col-count">Tasks</th>
            <th scope="col" class="tags-col-actions"><span class="amb-sr-only">Actions</span></th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body">
          <tr aria-hidden="true">
            <td><p-skeleton width="8rem" height="1.5rem" borderRadius="1rem"></p-skeleton></td>
            <td><p-skeleton width="2rem" height="1rem"></p-skeleton></td>
            <td>
              <div class="tags-actions">
                <p-skeleton shape="circle" size="2rem"></p-skeleton>
                <p-skeleton shape="circle" size="2rem"></p-skeleton>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    } @else if (loadFailed()) {
      <amb-empty-state
        tone="error"
        icon="pi pi-exclamation-triangle"
        title="We couldn't load your tags"
        text="The TaskPulse API did not respond. Check that it is running, then try again."
      >
        <p-button label="Try again" icon="pi pi-refresh" [outlined]="true" (onClick)="reload()"></p-button>
      </amb-empty-state>
    } @else if (tags().length === 0) {
      <amb-empty-state
        icon="pi pi-tags"
        title="No tags yet"
        text="Tags group related tasks and give the list and board something to filter by."
      >
        <p-button label="Create a tag" icon="pi pi-plus-circle" (onClick)="openCreate()"></p-button>
      </amb-empty-state>
    } @else {
      <p-table
        [value]="tags()"
        dataKey="id"
        [rowHover]="true"
        responsiveLayout="stack"
        breakpoint="640px"
        styleClass="tags-table"
      >
        <ng-template pTemplate="header">
          <tr>
            <th scope="col">Tag</th>
            <th scope="col" class="tags-col-count">Tasks</th>
            <th scope="col" class="tags-col-actions"><span class="amb-sr-only">Actions</span></th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-tag>
          <tr>
            <td>
              <span class="p-datatable-column-title">Tag</span>
              <amb-badge
                [label]="tag.name"
                [color]="tag.color"
                [textColor]="textColor(tag.color)"
                rounded
              />
            </td>

            <td class="tags-col-count">
              <span class="p-datatable-column-title">Tasks</span>
              @if (tag.taskCount) {
                <span class="tags-count amb-num">{{ tag.taskCount }}</span>
              } @else {
                <span class="tags-count tags-count--zero">Unused</span>
              }
            </td>

            <td class="tags-col-actions">
              <span class="p-datatable-column-title">Actions</span>
              <div class="tags-actions">
                <p-button
                  icon="pi pi-pen-to-square"
                  [rounded]="true"
                  [text]="true"
                  severity="secondary"
                  pTooltip="Edit tag"
                  tooltipPosition="top"
                  ariaLabel="Edit tag"
                  [disabled]="isBusy(tag.id)"
                  (onClick)="openEdit(tag)"
                ></p-button>
                <p-button
                  icon="pi pi-trash"
                  [rounded]="true"
                  [text]="true"
                  severity="danger"
                  pTooltip="Delete tag"
                  tooltipPosition="top"
                  ariaLabel="Delete tag"
                  [disabled]="isBusy(tag.id)"
                  (onClick)="onDelete(tag)"
                ></p-button>
              </div>
            </td>
          </tr>
        </ng-template>
      </p-table>
    }
  </amb-table>
</amb-page>

<amb-dialog [(visible)]="dialogVisible" [header]="dialogHeader" width="sm">
  <form class="tags-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <amb-form-field label="Name" for="tag-name" required [error]="nameError()">
      <input
        id="tag-name"
        type="text"
        pInputText
        ambInput
        formControlName="name"
        placeholder="Work, Personal, Urgent..."
        autocomplete="off"
      />
    </amb-form-field>

    <amb-form-field label="Colour" labelId="tag-color-label">
      <!-- A fixed palette rather than a free picker: eight hues that stay
           distinguishable from each other keep a task's chips readable. -->
      <div class="tags-swatches" role="radiogroup" aria-labelledby="tag-color-label">
        @for (choice of colorChoices; track choice) {
          <button
            type="button"
            class="tags-swatch"
            [class.tags-swatch--active]="previewColor === choice"
            [style.background]="choice"
            role="radio"
            [attr.aria-checked]="previewColor === choice"
            [attr.aria-label]="'Colour ' + choice"
            (click)="pickColor(choice)"
          >
            @if (previewColor === choice) {
              <i class="pi pi-check" [style.color]="textColor(choice)" aria-hidden="true"></i>
            }
          </button>
        }
      </div>
    </amb-form-field>

    <amb-form-field label="Preview" labelId="tag-preview-label">
      <div class="tags-preview" aria-labelledby="tag-preview-label">
        <amb-badge
          [label]="previewName"
          [color]="previewColor"
          [textColor]="textColor(previewColor)"
          rounded
        />
      </div>
    </amb-form-field>
  </form>

  <ng-container ambDialogFooter>
    <p-button
      label="Cancel"
      severity="secondary"
      [text]="true"
      [disabled]="saving()"
      (onClick)="onCancel()"
    ></p-button>
    <p-button
      [label]="editing() ? 'Save' : 'Create'"
      icon="pi pi-check"
      [disabled]="form.invalid || saving()"
      [loading]="saving()"
      (onClick)="onSubmit()"
    ></p-button>
  </ng-container>
</amb-dialog>
