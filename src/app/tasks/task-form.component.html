<amb-dialog
  [visible]="visible"
  (visibleChange)="onVisibleChange($event)"
  [header]="(editing ? 'taskForm.edit' : 'taskForm.new') | t"
  width="md"
>
  <form class="task-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <amb-form-field [label]="'taskForm.title' | t" for="task-title" required [error]="titleError()">
      <input
        id="task-title"
        type="text"
        pInputText
        ambInput
        formControlName="title"
        [placeholder]="'taskForm.titlePlaceholder' | t"
        autocomplete="off"
      />
    </amb-form-field>

    <amb-form-field [label]="'taskForm.description' | t" for="task-description">
      <textarea
        id="task-description"
        pTextarea
        ambInput
        formControlName="description"
        rows="3"
        [placeholder]="'taskForm.descriptionPlaceholder' | t"
      ></textarea>
    </amb-form-field>

    <!-- Status, priority and due date sit on one row: they are the three short
         "when and how much" fields, and stacking them would push the tag picker
         below the fold of the dialog. -->
    <div class="task-form__row">
      <amb-form-field [label]="'taskForm.status' | t" for="task-status">
        <p-select
          inputId="task-status"
          ambSelect
          formControlName="status"
          [options]="statusChoices()"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          [fluid]="true"
        ></p-select>
      </amb-form-field>

      <amb-form-field [label]="'taskForm.priority' | t" for="task-priority">
        <p-select
          inputId="task-priority"
          ambSelect
          formControlName="priority"
          [options]="priorityChoices()"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          [fluid]="true"
        >
          <ng-template #selectedItem let-selected>
            <span class="task-form__choice">
              <i [class]="selected.icon" aria-hidden="true"></i>
              {{ selected.label }}
            </span>
          </ng-template>
          <ng-template #item let-option>
            <span class="task-form__choice">
              <i [class]="option.icon" aria-hidden="true"></i>
              {{ option.label }}
            </span>
          </ng-template>
        </p-select>
      </amb-form-field>

      <amb-form-field [label]="'taskForm.due' | t" for="task-due-date">
        <p-datepicker
          inputId="task-due-date"
          ambSelect
          formControlName="dueDate"
          [showIcon]="true"
          dateFormat="yy-mm-dd"
          appendTo="body"
          [fluid]="true"
          [showButtonBar]="true"
          [placeholder]="'taskForm.duePlaceholder' | t"
        ></p-datepicker>
      </amb-form-field>
    </div>

    @if (tags().length > 0) {
      <amb-form-field [label]="'taskForm.tags' | t" for="task-tags">
        <p-multiselect
          inputId="task-tags"
          ambSelect
          formControlName="tagIds"
          [options]="tags()"
          optionLabel="name"
          optionValue="id"
          display="chip"
          appendTo="body"
          [fluid]="true"
          [showToggleAll]="false"
          [placeholder]="'taskForm.tagsPlaceholder' | t"
          [emptyMessage]="'taskForm.tagsEmpty' | t"
        >
          <ng-template #item let-tag>
            <span class="task-form__choice">
              <span class="task-form__swatch" [style.background]="tag.color" aria-hidden="true"></span>
              {{ tag.name }}
            </span>
          </ng-template>
        </p-multiselect>
      </amb-form-field>
    } @else {
      <amb-form-field
        [label]="'taskForm.tags' | t"
        labelId="task-tags-label"
        [hint]="'taskForm.tagsHint' | t"
      >
        <!-- Nothing to choose from, so no control: the hint is the whole field. -->
      </amb-form-field>
    }
  </form>

  <ng-container ambDialogFooter>
    <p-button
      [label]="'common.cancel' | t"
      severity="secondary"
      [text]="true"
      [disabled]="saving"
      (onClick)="onCancel()"
    ></p-button>
    <p-button
      [label]="(editing ? 'common.save' : 'common.create') | t"
      icon="pi pi-check"
      [disabled]="form.invalid || saving"
      [loading]="saving"
      (onClick)="onSubmit()"
    ></p-button>
  </ng-container>
</amb-dialog>
