<amb-dialog
  [visible]="visible"
  (visibleChange)="onVisibleChange($event)"
  [header]="editing ? 'Edit task' : 'New task'"
  width="md"
>
  <form class="task-form" [formGroup]="form" (ngSubmit)="onSubmit()">
    <amb-form-field label="Title" for="task-title" required [error]="titleError()">
      <input
        id="task-title"
        type="text"
        pInputText
        ambInput
        formControlName="title"
        placeholder="What needs to be done?"
        autocomplete="off"
      />
    </amb-form-field>

    <amb-form-field label="Description" for="task-description">
      <textarea
        id="task-description"
        pTextarea
        ambInput
        formControlName="description"
        rows="3"
        placeholder="Add a few details (optional)"
      ></textarea>
    </amb-form-field>

    <!-- Status, priority and due date sit on one row: they are the three short
         "when and how much" fields, and stacking them would push the tag picker
         below the fold of the dialog. -->
    <div class="task-form__row">
      <amb-form-field label="Status" for="task-status">
        <p-select
          inputId="task-status"
          ambSelect
          formControlName="status"
          [options]="statusChoices"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          [fluid]="true"
        ></p-select>
      </amb-form-field>

      <amb-form-field label="Priority" for="task-priority">
        <p-select
          inputId="task-priority"
          ambSelect
          formControlName="priority"
          [options]="priorityChoices"
          optionLabel="label"
          optionValue="value"
          appendTo="body"
          [fluid]="true"
        >
          <ng-template #selectedItem let-selected>
            <span class="task-form__choice">
              <i [class]="selected.icon" aria-hidden="true"></i>
              {{ selected.label }}
            </span>
          </ng-template>
          <ng-template #item let-option>
            <span class="task-form__choice">
              <i [class]="option.icon" aria-hidden="true"></i>
              {{ option.label }}
            </span>
          </ng-template>
        </p-select>
      </amb-form-field>

      <amb-form-field label="Due date" for="task-due-date">
        <p-datepicker
          inputId="task-due-date"
          ambSelect
          formControlName="dueDate"
          [showIcon]="true"
          dateFormat="yy-mm-dd"
          appendTo="body"
          [fluid]="true"
          [showButtonBar]="true"
          placeholder="yyyy-mm-dd"
        ></p-datepicker>
      </amb-form-field>
    </div>

    @if (tags().length > 0) {
      <amb-form-field label="Tags" for="task-tags">
        <p-multiselect
          inputId="task-tags"
          ambSelect
          formControlName="tagIds"
          [options]="tags()"
          optionLabel="name"
          optionValue="id"
          display="chip"
          appendTo="body"
          [fluid]="true"
          [showToggleAll]="false"
          placeholder="Add tags (optional)"
          emptyMessage="No tags yet"
        >
          <ng-template #item let-tag>
            <span class="task-form__choice">
              <span class="task-form__swatch" [style.background]="tag.color" aria-hidden="true"></span>
              {{ tag.name }}
            </span>
          </ng-template>
        </p-multiselect>
      </amb-form-field>
    } @else {
      <amb-form-field
        label="Tags"
        labelId="task-tags-label"
        hint="You have no tags yet. Create some on the Tags screen and they will appear here."
      >
        <!-- Nothing to choose from, so no control: the hint is the whole field. -->
      </amb-form-field>
    }
  </form>

  <ng-container ambDialogFooter>
    <p-button
      label="Cancel"
      severity="secondary"
      [text]="true"
      [disabled]="saving"
      (onClick)="onCancel()"
    ></p-button>
    <p-button
      [label]="editing ? 'Save' : 'Create'"
      icon="pi pi-check"
      [disabled]="form.invalid || saving"
      [loading]="saving"
      (onClick)="onSubmit()"
    ></p-button>
  </ng-container>
</amb-dialog>
