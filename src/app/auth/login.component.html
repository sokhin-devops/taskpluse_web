<p-toast position="top-right"></p-toast>

<section class="auth-card amb-surface-3">
  <header class="auth-card__head">
    <span class="auth-card__mark" aria-hidden="true">
      <i class="pi pi-check-circle"></i>
    </span>
    <h1 class="amb-page-title">TaskPulse</h1>
    <p class="amb-page-subtitle">
      {{ (mode() === 'login' ? 'auth.signInSubtitle' : 'auth.registerSubtitle') | t }}
    </p>
  </header>

  @if (sessionExpired()) {
    <p-message severity="warn" styleClass="auth-card__notice">
      {{ 'auth.expired' | t }}
    </p-message>
  }

  <p-selectbutton
    [options]="modeOptions()"
    [ngModel]="mode()"
    (ngModelChange)="setMode($event)"
    [ngModelOptions]="{ standalone: true }"
    optionLabel="label"
    optionValue="value"
    [allowEmpty]="false"
    styleClass="auth-card__modes"
    [ariaLabel]="'auth.modeGroup' | t"
  ></p-selectbutton>

  @if (mode() === 'login') {
    <form class="auth-card__form" [formGroup]="loginForm" (ngSubmit)="onSubmitLogin()">
      <amb-form-field [label]="'auth.email' | t" for="login-email" [error]="loginEmailError()">
        <input
          id="login-email"
          type="email"
          pInputText
          ambInput
          formControlName="email"
          autocomplete="email"
          [placeholder]="'auth.emailPlaceholder' | t"
        />
      </amb-form-field>

      <amb-form-field
        [label]="'auth.password' | t"
        for="login-password"
        [error]="loginPasswordError()"
      >
        <p-password
          inputId="login-password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          [fluid]="true"
          autocomplete="current-password"
          [placeholder]="'auth.passwordPlaceholder' | t"
        ></p-password>
      </amb-form-field>

      <p-button
        type="submit"
        [label]="'auth.signIn' | t"
        icon="pi pi-sign-in"
        [fluid]="true"
        [loading]="submitting()"
        [disabled]="submitting()"
        styleClass="auth-card__submit"
      ></p-button>
    </form>
  } @else {
    <form class="auth-card__form" [formGroup]="registerForm" (ngSubmit)="onSubmitRegister()">
      <amb-form-field
        [label]="'auth.name' | t"
        for="register-name"
        [error]="registerNameError()"
      >
        <input
          id="register-name"
          type="text"
          pInputText
          ambInput
          formControlName="displayName"
          autocomplete="name"
          [placeholder]="'auth.namePlaceholder' | t"
        />
      </amb-form-field>

      <amb-form-field
        [label]="'auth.email' | t"
        for="register-email"
        [error]="registerEmailError()"
      >
        <input
          id="register-email"
          type="email"
          pInputText
          ambInput
          formControlName="email"
          autocomplete="email"
          [placeholder]="'auth.emailPlaceholder' | t"
        />
      </amb-form-field>

      <amb-form-field
        [label]="'auth.password' | t"
        for="register-password"
        [error]="registerPasswordError()"
        [hint]="passwordHint()"
      >
        <p-password
          inputId="register-password"
          formControlName="password"
          [toggleMask]="true"
          [fluid]="true"
          autocomplete="new-password"
          [placeholder]="'auth.newPasswordPlaceholder' | t: { min: minPasswordLength }"
        ></p-password>
      </amb-form-field>

      <p-button
        type="submit"
        [label]="'auth.createAccount' | t"
        icon="pi pi-user-plus"
        [fluid]="true"
        [loading]="submitting()"
        [disabled]="submitting()"
        styleClass="auth-card__submit"
      ></p-button>
    </form>
  }
</section>
