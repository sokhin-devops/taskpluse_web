<p-toast position="top-right"></p-toast>

<section class="auth-card amb-surface-3">
  <header class="auth-card__head">
    <span class="auth-card__mark" aria-hidden="true">
      <i class="pi pi-check-circle"></i>
    </span>
    <h1 class="amb-page-title">TaskPulse</h1>
    <p class="amb-page-subtitle">
      {{
        mode() === 'login'
          ? 'Sign in to pick up where you left off.'
          : 'Create an account to start tracking work.'
      }}
    </p>
  </header>

  @if (sessionExpired()) {
    <p-message severity="warn" styleClass="auth-card__notice">
      Your session expired. Please sign in again.
    </p-message>
  }

  <p-selectbutton
    [options]="modeOptions"
    [ngModel]="mode()"
    (ngModelChange)="setMode($event)"
    [ngModelOptions]="{ standalone: true }"
    optionLabel="label"
    optionValue="value"
    [allowEmpty]="false"
    styleClass="auth-card__modes"
    aria-label="Choose whether to sign in or create an account"
  ></p-selectbutton>

  @if (mode() === 'login') {
    <form class="auth-card__form" [formGroup]="loginForm" (ngSubmit)="onSubmitLogin()">
      <amb-form-field label="Email" for="login-email" [error]="loginEmailError()">
        <input
          id="login-email"
          type="email"
          pInputText
          ambInput
          formControlName="email"
          autocomplete="email"
          placeholder="you@example.com"
        />
      </amb-form-field>

      <amb-form-field label="Password" for="login-password" [error]="loginPasswordError()">
        <p-password
          inputId="login-password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          [fluid]="true"
          autocomplete="current-password"
          placeholder="Your password"
        ></p-password>
      </amb-form-field>

      <p-button
        type="submit"
        label="Sign in"
        icon="pi pi-sign-in"
        [fluid]="true"
        [loading]="submitting()"
        [disabled]="submitting()"
        styleClass="auth-card__submit"
      ></p-button>
    </form>
  } @else {
    <form class="auth-card__form" [formGroup]="registerForm" (ngSubmit)="onSubmitRegister()">
      <amb-form-field label="Your name" for="register-name" [error]="registerNameError()">
        <input
          id="register-name"
          type="text"
          pInputText
          ambInput
          formControlName="displayName"
          autocomplete="name"
          placeholder="Sam Rivera"
        />
      </amb-form-field>

      <amb-form-field label="Email" for="register-email" [error]="registerEmailError()">
        <input
          id="register-email"
          type="email"
          pInputText
          ambInput
          formControlName="email"
          autocomplete="email"
          placeholder="you@example.com"
        />
      </amb-form-field>

      <amb-form-field
        label="Password"
        for="register-password"
        [error]="registerPasswordError()"
        [hint]="passwordHint"
      >
        <p-password
          inputId="register-password"
          formControlName="password"
          [toggleMask]="true"
          [fluid]="true"
          autocomplete="new-password"
          [placeholder]="'At least ' + minPasswordLength + ' characters'"
        ></p-password>
      </amb-form-field>

      <p-button
        type="submit"
        label="Create account"
        icon="pi pi-user-plus"
        [fluid]="true"
        [loading]="submitting()"
        [disabled]="submitting()"
        styleClass="auth-card__submit"
      ></p-button>
    </form>
  }
</section>
