<!-- The ambient canvas. Fixed, behind everything, rendered once for the whole
     application so no screen has to think about it. -->
<amb-background />

<div
  class="amb-shell"
  [class.amb-shell--signed-out]="!isAuthenticated()"
  [class.amb-shell--rail]="navCollapsed()"
>
  @if (isAuthenticated()) {
    <amb-sidebar
      [brand]="brand()"
      [links]="navLinks()"
      [(open)]="navOpen"
      [collapsed]="navCollapsed()"
      (collapsedChange)="setNavCollapsed($event)"
      [navLabel]="'nav.landmark' | t"
      [expandLabel]="'nav.expand' | t"
      [collapseLabel]="'nav.collapse' | t"
    />
    <!-- Nothing projected into the rail's footer any more. The account lives in
         the topbar, which is on screen at every width — so the rail is the
         mark, the destinations, and the control that collapses it. -->
  }

  <div class="amb-shell__main">
    @if (!isAuthenticated()) {
      <!-- Signed out there is no rail and no Appearance screen to reach — it is
           behind the auth guard — so the control stays here. Someone who
           prefers dark should not have to sign in to get it.

           Above the scroll container rather than inside it: the signed-out
           content area centres its one child, and a second child would sit
           beside the login card rather than above it.

           Its link out to the full screen is suppressed for the same reason it
           is here at all: following it would bounce straight back to this page. -->
      <div class="app-guest-bar">
        <amb-theme-switcher [pageLink]="false" />
        <amb-language-switcher />
      </div>
    }

    @if (isAuthenticated()) {
      <!-- The bar sits above the scroll container, so nothing ever passes under
           it. The slot around it is what keeps its edges level with the page:
           it reserves the same scrollbar gutter the container below reserves,
           so both boxes are the same width. Without it the bar ran wider than
           the cards by that gutter on any screen under the content cap. -->
      <div class="amb-shell__topbar-slot">
      <amb-topbar [title]="pageTitle()" [subtitle]="greeting()">
        <!-- The drawer button is the only piece of the bar that is phone-only;
             above the nav breakpoint the rail is already on screen. -->
        <p-button
          ambTopbarLead
          class="app-topbar__menu"
          ambButton="ghost"
          icon="pi pi-bars"
          [rounded]="true"
          [ariaLabel]="'nav.open' | t"
          (onClick)="navOpen.set(true)"
        />

        <!-- No appearance control here. Signed in, the whole of it lives on the
             Appearance screen in the rail, which is a navigation item rather
             than an icon to be found. -->
        <amb-language-switcher ambTopbarActions />

        <!-- The account, at every width. The name is hidden on a narrow screen
             and the chip falls back to the avatar alone — but it is the same
             one control either way, so there is never a second copy of it in
             the accessibility tree. -->
        <button
          ambTopbarActions
          type="button"
          class="app-account__trigger"
          (click)="topbarAccount.toggle($event)"
          [attr.aria-label]="accountMenuLabel()"
          aria-haspopup="menu"
        >
          <amb-avatar [initials]="initials()" size="small" />
          <span class="app-account__name">{{ user()?.displayName }}</span>
          <i class="pi pi-angle-down app-account__caret" aria-hidden="true"></i>
        </button>
        <amb-menu
          ambTopbarActions
          #topbarAccount
          [items]="accountMenu()"
          popup
          [ariaLabel]="accountMenuLabel()"
        />
      </amb-topbar>
      </div>
    }

    <!-- The application's only scroll container; AppComponent sends it back to
         the top between screens. -->
    <!-- `cdkScrollable` registers this with the CDK's drag-and-drop, which will
         not auto-scroll an ancestor it has not been told about. Without it a
         card on the board could not be dragged past the bottom of the window:
         the page simply would not move, and the only way to reach a position
         below the fold was to drop the card somewhere else first. -->
    <main
      class="amb-shell__content"
      cdkScrollable
      #scrollArea
      [class.amb-shell__content--centred]="!isAuthenticated()"
    >
      <router-outlet />
    </main>
  </div>
</div>
